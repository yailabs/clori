name: Bug report
description: Report incorrect or misleading behavior. Report vulnerabilities privately.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For usage help, read [SUPPORT.md](https://github.com/yailabs/yvex/blob/main/SUPPORT.md).
        Report security vulnerabilities [privately](https://github.com/yailabs/yvex/security/advisories/new).
        Do not include model payloads, private prompts or responses, credentials, or private paths.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State the exact command/API boundary, result, and failure identity.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected contract
      description: Describe the expected behavior; link documentation or code if known.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include bounded commands and sanitized inputs. Do not attach model or runtime evidence assets.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: YVEX commit
      placeholder: 40-character commit identity
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Compiler, backend, device, and relevant build profile without private paths.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Ownership and impact
      description: Describe what this prevents you from doing. Name the affected owner or roadmap boundary if known.
    validations:
      required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Evidence hygiene
      options:
        - label: I removed credentials, prompts, generated responses, model files, bindings, traces, and machine-private paths.
          required: true
