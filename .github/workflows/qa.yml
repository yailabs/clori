name: QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hermetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native QA prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep zlib1g-dev
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.28
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Diagnose QA environment
        run: python3 tools/qa.py doctor
      - name: Run canonical hosted lane
        run: python3 tools/qa.py run ci
      - name: Upload structured evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yvex-qa-evidence
          path: |
            build/qa/evidence/
            build/qa/runs/*/logs/
          if-no-files-found: warn
          retention-days: 14
