<text x="84" y="168" class="node-title" font-family="Liberation Sans, Arial, sans-serif">01  Source evidence</text>
<text x="56" y="194" class="body" font-family="Liberation Sans, Arial, sans-serif">immutable provenance · inventory · authenticated bytes</text>
</g>
<g id="architecture"><rect class="node evidence" x="40" y="230" width="552" height="78"/>
<rect x="52" y="244" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="261" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="262" class="node-title" font-family="Liberation Sans, Arial, sans-serif">02  Architecture evidence</text>
<text x="56" y="288" class="body" font-family="Liberation Sans, Arial, sans-serif">roles · topology · state · tokenizer / output authority</text>
</g>
<g id="component"><rect class="node evidence" x="40" y="324" width="552" height="78"/>
<rect x="52" y="338" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="355" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="356" class="node-title" font-family="Liberation Sans, Arial, sans-serif">03  Component numerical evidence</text>
<text x="56" y="382" class="body" font-family="Liberation Sans, Arial, sans-serif">bounded independent oracle · declared tolerances</text>
</g>
<g id="artifact"><rect class="node evidence" x="40" y="418" width="552" height="78"/>
<rect x="52" y="432" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="449" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="450" class="node-title" font-family="Liberation Sans, Arial, sans-serif">04  Artifact / deployment evidence</text>
<text x="56" y="476" class="body" font-family="Liberation Sans, Arial, sans-serif">complete package · binding · admitted specialization</text>
</g>
<g id="lifecycle"><rect class="node evidence" x="40" y="512" width="552" height="78"/>
<rect x="52" y="526" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="543" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="544" class="node-title" font-family="Liberation Sans, Arial, sans-serif">05  Runtime lifecycle evidence</text>
<text x="56" y="570" class="body" font-family="Liberation Sans, Arial, sans-serif">isolation · cancellation · rollback · cleanup</text>
</g>
<g id="whole"><rect class="node evidence" x="40" y="606" width="552" height="78"/>
<rect x="52" y="620" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="637" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="638" class="node-title" font-family="Liberation Sans, Arial, sans-serif">06  Whole-model execution</text>
<text x="56" y="664" class="body" font-family="Liberation Sans, Arial, sans-serif">real input → retained state → typed terminal output</text>
</g>
<g id="quality"><rect class="node evidence" x="40" y="700" width="552" height="78"/>
<rect x="52" y="714" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="731" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="732" class="node-title" font-family="Liberation Sans, Arial, sans-serif">07  Behavior / quality evaluation</text>
<text x="56" y="758" class="body" font-family="Liberation Sans, Arial, sans-serif">declared cases and scorer on the admitted product path</text>
</g>
<g id="benchmark"><rect class="node evidence" x="40" y="794" width="552" height="78"/>
<rect x="52" y="808" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="825" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="826" class="node-title" font-family="Liberation Sans, Arial, sans-serif">08  Full-model benchmark</text>
<text x="56" y="852" class="body" font-family="Liberation Sans, Arial, sans-serif">controlled identities · repeated workload measurements</text>
</g>
<g id="release"><rect class="node evidence" x="40" y="888" width="552" height="78"/>
<rect x="52" y="902" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="63.5" y="919" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="84" y="920" class="node-title" font-family="Liberation Sans, Arial, sans-serif">09  Release qualification</text>
<text x="56" y="946" class="body" font-family="Liberation Sans, Arial, sans-serif">all required gates + package, claims and reproducibility</text>
</g>
<g id="not-inventory"><rect class="node evidence" x="660" y="136" width="496" height="104"/>
<rect x="672" y="150" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="167" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="168" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Inventory ≠ executable model</text>
<text x="676" y="194" class="body" font-family="Liberation Sans, Arial, sans-serif">finding every tensor does not create</text>
<text x="676" y="219" class="body" font-family="Liberation Sans, Arial, sans-serif">an admitted execution plan</text>
</g>
<g id="not-component"><rect class="node evidence" x="660" y="260" width="496" height="104"/>
<rect x="672" y="274" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="291" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="292" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Component ≠ whole model</text>
<text x="676" y="318" class="body" font-family="Liberation Sans, Arial, sans-serif">an oracle at one operator or layer cannot</text>
<text x="676" y="343" class="body" font-family="Liberation Sans, Arial, sans-serif">establish all-layer output correctness</text>
</g>
<g id="not-load"><rect class="node evidence" x="660" y="384" width="496" height="104"/>
<rect x="672" y="398" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="415" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="416" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Load ≠ generation</text>
<text x="676" y="442" class="body" font-family="Liberation Sans, Arial, sans-serif">allocated resources do not prove prefill,</text>
<text x="676" y="467" class="body" font-family="Liberation Sans, Arial, sans-serif">state continuity, logits or terminal output</text>
</g>
<g id="not-quality"><rect class="node evidence" x="660" y="508" width="496" height="104"/>
<rect x="672" y="522" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="539" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="540" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Generation ≠ quality</text>
<text x="676" y="566" class="body" font-family="Liberation Sans, Arial, sans-serif">plausible output and execution success</text>
<text x="676" y="591" class="body" font-family="Liberation Sans, Arial, sans-serif">do not substitute for declared evaluation</text>
</g>
<g id="not-benchmark"><rect class="node evidence" x="660" y="632" width="496" height="104"/>
<rect x="672" y="646" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="663" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="664" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Characterization ≠ benchmark</text>
<text x="676" y="690" class="body" font-family="Liberation Sans, Arial, sans-serif">one timing, an estimate or component gain</text>
<text x="676" y="715" class="body" font-family="Liberation Sans, Arial, sans-serif">cannot establish release performance</text>
</g>
<g id="not-release"><rect class="node evidence" x="660" y="756" width="496" height="104"/>
<rect x="672" y="770" width="23" height="23" fill="#f7f7f7" stroke="#525252"/>
<text x="683.5" y="787" class="tag" font-family="Liberation Sans, Arial, sans-serif">E</text>
<text x="704" y="788" class="node-title" font-family="Liberation Sans, Arial, sans-serif">Benchmark ≠ release</text>
<text x="676" y="814" class="body" font-family="Liberation Sans, Arial, sans-serif">missing semantic, numerical or operational</text>
<text x="676" y="839" class="body" font-family="Liberation Sans, Arial, sans-serif">evidence still blocks qualification</text>
</g>
<text x="676" y="906" class="note" font-family="Liberation Sans, Arial, sans-serif">Missing proof → retain the lower truthful stage.</text>
<text x="676" y="935" class="note" font-family="Liberation Sans, Arial, sans-serif">Identity drift → requalify dependent claims.</text>
<text x="676" y="964" class="note" font-family="Liberation Sans, Arial, sans-serif">Green software QA alone does not close a model.</text>
