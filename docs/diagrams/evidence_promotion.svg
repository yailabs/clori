<title id="title">Evidence bounds every promotion claim</title>
<desc id="desc">The evidence ladder separates source and architecture facts, component numerics, admitted artifacts and deployments, runtime lifecycle, whole-model execution, quality evaluation, benchmark and release. Each stronger claim needs its own evidence; lower-level success does not imply any later stage. This is a qualification discipline, not a statement that every gate is complete.</desc>
