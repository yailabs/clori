<title id="title">Family semantics terminate at admitted plans</title>
<desc id="desc">Family interpretation provides tensor roles, topology, state geometry and numerical obligations to shared compiler sealing. Runtime mechanisms consume admitted records. Existing architecture consumers have different evidence depths; Mamba2 remains source and SSD component only, with no executable descriptor or hosted engine.</desc>
