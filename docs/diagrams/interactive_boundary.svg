<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">Interactive editing is not runtime ownership</title>
<desc id="desc">REPLAI is a pinned, statically linked editor inside yvex chat. It returns submitted UTF-8 and generic input events, restores terminal state before dispatch, and owns no product request semantics. YVEX owns history admission, command completion decisions, attachments, generation-bound requests, cancellation and result rendering. No editable prompt coexists with generation.</desc>
