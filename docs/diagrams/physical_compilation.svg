<title id="title">From provider source to an active engine</title>
<desc id="desc">Three separate authorities establish source meaning, physical package and current deployment compatibility. Passing preparation does not load an engine. Load revalidates admission and resources, specializes for a real backend/device and publishes an exact engine generation. A failed gate never advances to the next state.</desc>
