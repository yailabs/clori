<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Runtime host and session ownership</title>
  <desc id="desc">Many clients connect across a private local protocol to one long-lived yvexd process. The daemon owns immutable model resources, a bounded model worker, and a registry of conversation sessions. Each conversation session owns one persistent execution session with KV, position, token ledger, RNG, and turn state. One typed event authority feeds raw trace, engine watch, metrics, and the product client.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L0 6L9 3z" class="arrow-fill"/></marker>
    <style>
      :root{color-scheme:light dark}.host{fill:#faf5ff;stroke:#6d28d9;stroke-width:2.2}.group{fill:#fff;stroke:#7c3aed;stroke-width:1.7}.client-box{fill:#fff7ed;stroke:#ea580c;stroke-width:1.9}.event-box{fill:#faf5ff;stroke:#7c3aed;stroke-width:1.7}.surface{fill:#fff7ed;stroke:#ea580c;stroke-width:1.9}.state{fill:#fff;stroke:#7c3aed;stroke-width:1.6}.head{fill:#0f172a;font-family:sans-serif;font-size:38px;font-weight:700;text-anchor:middle}.subhead{fill:#334155;font-family:sans-serif;font-size:20px;font-style:italic;text-anchor:middle}.section{font-family:sans-serif;font-size:19px;font-weight:700}.text{fill:#0f172a;font-family:sans-serif;font-size:14px;font-weight:600;text-anchor:middle}.small{fill:#334155;font-family:sans-serif;font-size:12px;text-anchor:middle}.line{fill:none;stroke:#1f2937;stroke-width:2;marker-end:url(#arrow)}.control{fill:none;stroke:#475569;stroke-width:1.9;stroke-dasharray:8 7;marker-end:url(#arrow)}.event{fill:none;stroke:#6d28d9;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#arrow)}.assoc{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:2 4}.divider{stroke:#475569;stroke-width:2;stroke-dasharray:8 7}.arrow-fill{fill:#1f2937}.foot{fill:#0f172a;font-family:sans-serif;font-size:17px;font-weight:600;text-anchor:middle}
      @media (prefers-color-scheme: dark){.host,.event-box{fill:#2e1065;stroke:#c4b5fd}.group,.state{fill:#111827;stroke:#c4b5fd}.client-box,.surface{fill:#431407;stroke:#fdba74}.head,.text,.foot{fill:#f8fafc}.subhead,.small{fill:#cbd5e1}.line,.control{stroke:#e2e8f0}.event,.assoc{stroke:#c4b5fd}.divider{stroke:#94a3b8}.arrow-fill{fill:#e2e8f0}}
    </style>
  </defs>
  <text class="head" x="800" y="48">Runtime Host &amp; Session Ownership</text>
  <text class="subhead" x="800" y="80">One model host, server-owned persistent sessions, and one typed event flow</text>

  <text class="section" x="30" y="142" fill="#ea580c">Client connections</text>
  <line class="divider" x1="245" y1="105" x2="245" y2="865"/>
  <text class="small" x="280" y="130">private protocol boundary</text>

  <g transform="translate(35 205)"><rect class="client-box" width="165" height="125" rx="12"/><text class="text" x="82" y="48">Client A</text><text class="small" x="82" y="78">connect · request</text><text class="small" x="82" y="101">event stream</text></g>
  <g transform="translate(35 405)"><rect class="client-box" width="165" height="125" rx="12"/><text class="text" x="82" y="48">Client B</text><text class="small" x="82" y="78">attach · cancel</text><text class="small" x="82" y="101">detach</text></g>
  <g transform="translate(35 605)"><rect class="client-box" width="165" height="125" rx="12"/><text class="text" x="82" y="48">Client N</text><text class="small" x="82" y="78">independent connection</text><text class="small" x="82" y="101">not a session</text></g>

  <rect class="host" x="285" y="115" width="720" height="750" rx="18"/>
  <text class="section" x="645" y="151" fill="#6d28d9" text-anchor="middle">yvexd · long-lived runtime host</text>

  <rect class="group" x="320" y="180" width="650" height="140" rx="12"/>
  <text class="text" x="645" y="210">Process-lifetime immutable resources</text>
  <rect class="state" x="345" y="235" width="180" height="60" rx="8"/><text class="small" x="435" y="263">runtime model</text><text class="small" x="435" y="283">binding + variant</text>
  <rect class="state" x="555" y="235" width="180" height="60" rx="8"/><text class="small" x="645" y="263">tokenizer + plans</text><text class="small" x="645" y="283">shared immutable data</text>
  <rect class="state" x="765" y="235" width="180" height="60" rx="8"/><text class="small" x="855" y="263">residency</text><text class="small" x="855" y="283">output head + weights</text>

  <rect class="group" x="320" y="345" width="650" height="175" rx="12"/>
  <text class="text" x="645" y="376">Model worker</text>
  <rect class="state" x="355" y="405" width="210" height="75" rx="8"/><text class="text" x="460" y="434">Bounded request queue</text><text class="small" x="460" y="459">explicit refusal + cancellation</text>
  <rect class="state" x="615" y="405" width="315" height="75" rx="8"/><text class="text" x="772" y="434">Serialized execution coordinator</text><text class="small" x="772" y="459">one graph mutation at a time</text>
  <path class="line" d="M565 442H608"/>
  <path class="assoc" d="M435 320V340H772"/><path class="assoc" d="M645 320V340"/><path class="assoc" d="M855 320V340H772"/>

  <rect class="group" x="320" y="545" width="650" height="285" rx="12"/>
  <text class="text" x="645" y="576">Server-owned conversation session</text>
  <rect class="state" x="350" y="605" width="270" height="185" rx="9"/>
  <text class="text" x="485" y="633">Conversation authority</text>
  <text class="small" x="485" y="670">transcript + message roles</text>
  <text class="small" x="485" y="701">committed token ledger</text>
  <text class="small" x="485" y="732">turn records + attachment</text>
  <text class="small" x="485" y="763">partial-state policy</text>
  <rect class="state" x="650" y="605" width="285" height="185" rx="9"/>
  <text class="text" x="792" y="633">Persistent execution session</text>
  <text class="small" x="792" y="670">KV + context position</text>
  <text class="small" x="792" y="701">Transformer workspace</text>
  <text class="small" x="792" y="732">sampling RNG + decoder</text>
  <text class="small" x="792" y="763">exact prefix identity</text>
  <path class="assoc" d="M620 697H643"/>
  <path class="assoc" d="M772 520V598"/>

  <path class="line" d="M200 267H278"/><path class="control" d="M278 305H200"/>
  <path class="line" d="M200 467H278"/><path class="control" d="M278 505H200"/>
  <path class="line" d="M200 667H278"/><path class="control" d="M278 705H200"/>
  <path class="line" d="M285 267H313"/>

  <rect class="event-box" x="1045" y="115" width="255" height="750" rx="15"/>
  <text class="section" x="1172" y="151" fill="#6d28d9" text-anchor="middle">Typed event authority</text>
  <g transform="translate(1075 190)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Lifecycle events</text><text class="small" x="97" y="56">start · ready · close</text></g>
  <g transform="translate(1075 300)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Request events</text><text class="small" x="97" y="56">queue · prefill · decode</text></g>
  <g transform="translate(1075 410)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Generation events</text><text class="small" x="97" y="56">fragment · stop · failure</text></g>
  <g transform="translate(1075 520)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Session events</text><text class="small" x="97" y="56">attach · reset · partial</text></g>
  <g transform="translate(1075 630)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Metrics</text><text class="small" x="97" y="56">same authoritative counts</text></g>
  <g transform="translate(1075 740)"><rect class="state" width="195" height="85" rx="8"/><text class="text" x="97" y="31">Backpressure</text><text class="small" x="97" y="56">bounded + observable</text></g>
  <path class="event" d="M930 442H1038"/><path class="event" d="M935 697H1038"/>

  <text class="section" x="1335" y="142" fill="#ea580c">Client-facing surfaces</text>
  <g transform="translate(1340 205)"><rect class="surface" width="220" height="145" rx="12"/><text class="text" x="110" y="44">Raw trace</text><text class="small" x="110" y="78">complete typed JSONL</text><text class="small" x="110" y="104">debug + post-mortem</text><text class="small" x="110" y="126">content private by default</text></g>
  <g transform="translate(1340 395)"><rect class="surface" width="220" height="145" rx="12"/><text class="text" x="110" y="44">Engine watch</text><text class="small" x="110" y="78">compact runtime stages</text><text class="small" x="110" y="104">TTFT · rates · memory</text><text class="small" x="110" y="126">no prompt content</text></g>
  <g transform="translate(1340 585)"><rect class="surface" width="220" height="145" rx="12"/><text class="text" x="110" y="44">REPL / chat</text><text class="small" x="110" y="78">streamed committed text</text><text class="small" x="110" y="104">attach + reconnect</text><text class="small" x="110" y="126">concise turn metrics</text></g>
  <path class="line" d="M1300 250H1333"/><path class="line" d="M1300 467H1333"/><path class="line" d="M1005 267C1270 80 1280 657 1333 657"/>

  <rect class="group" x="25" y="900" width="1550" height="62" rx="11"/>
  <text class="foot" x="800" y="938">Host lifetime  ·  Session ownership  ·  Persistent KV  ·  Bounded execution  ·  Typed evidence</text>
  <text class="small" x="800" y="1008">Solid: request/data flow   ·   dashed: protocol response/control   ·   dotted: ownership   ·   purple dashed: event flow</text>
</svg>
