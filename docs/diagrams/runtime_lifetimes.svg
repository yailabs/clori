<title id="title">Runtime lifetimes, state and physical work</title>
<desc id="desc">The persistent host retains generation-scoped engines and session registries. Sessions and model leases pin a generation. Executable batches describe selected work rather than owning session state. A schematic lifetime panel shows host survival before load and after unload, and session/lease lifetimes contained within one engine generation.</desc>
