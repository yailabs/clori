<title id="title">Storage, working set and residency are independent facts</title>
<desc id="desc">Remote provider availability, retained source and artifact bytes, logical working-set membership, current READY deployment and loaded engine resources are separate facts. Explicit commands cross boundaries. Managed copies and external references do not change provenance; cache does not prove identity. UMA device-addressability does not establish physical page residency.</desc>
