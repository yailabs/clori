<title id="title">System context and execution ownership</title>
<desc id="desc">Provider sources feed the offline acquisition and compiler owners. CLI and loopback HTTP consumers address one persistent host with generation-bound engines and independent sessions. Admitted graph operations reach CPU or CUDA; typed events observe execution without owning it.</desc>
