<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="620" viewBox="0 0 512 620"
     role="img" aria-labelledby="title desc"
     shape-rendering="geometricPrecision">
  <title id="title">YVEX logo</title>
  <desc id="desc">YVEX mark with an open metallic ring, gold diagonal, four-point star, and wordmark.</desc>

  <defs>
    <linearGradient id="ringMetal" gradientUnits="userSpaceOnUse"
                    x1="132" y1="92" x2="382" y2="366">
      <stop offset="0" stop-color="#686e76"/>
      <stop offset="0.22" stop-color="#a7abb1"/>
      <stop offset="0.50" stop-color="#747a82"/>
      <stop offset="0.78" stop-color="#b1b5ba"/>
      <stop offset="1" stop-color="#666c74"/>
    </linearGradient>

    <linearGradient id="gold" gradientUnits="userSpaceOnUse"
                    x1="56" y1="452" x2="456" y2="44">
      <stop offset="0" stop-color="#76501a"/>
      <stop offset="0.18" stop-color="#b98228"/>
      <stop offset="0.48" stop-color="#f1c14f"/>
      <stop offset="0.70" stop-color="#c28d30"/>
      <stop offset="1" stop-color="#684616"/>
    </linearGradient>

    <style>
      .ring-shadow { stroke: #202329; opacity: 0.34; }
      .ring-highlight { stroke: #ffffff; opacity: 0.30; }
      .slash-highlight { stroke: #fff0ad; opacity: 0.42; }
      .star { fill: #d6a222; }
      .star-core { fill: #fff1a1; }
      .word { fill: #666c75; }
      .word-accent { fill: #b6812b; }

      @media (prefers-color-scheme: dark) {
        .ring-shadow { stroke: #050607; opacity: 0.52; }
        .ring-highlight { opacity: 0.38; }
        .star { fill: #efbd35; }
        .star-core { fill: #fff8c9; }
        .word { fill: #c7cbd1; }
        .word-accent { fill: #d6a54b; }
      }
    </style>
  </defs>

  <!-- Two precise arcs leave intentional breaks aligned with the gold diagonal. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 390.0 125.4 A 170 170 0 0 1 146.7 360.2
             M 121.9 334.7 A 170 170 0 0 1 365.3 99.8"
          class="ring-shadow" stroke-width="9"/>
    <path d="M 390.0 125.4 A 170 170 0 0 1 146.7 360.2
             M 121.9 334.7 A 170 170 0 0 1 365.3 99.8"
          stroke="url(#ringMetal)" stroke-width="5.8"/>
    <path d="M 390.0 125.4 A 170 170 0 0 1 146.7 360.2
             M 121.9 334.7 A 170 170 0 0 1 365.3 99.8"
          class="ring-highlight" stroke-width="0.9"/>
  </g>

  <!-- Crisp diagonal: no raster blur, so the edge remains clean at README size. -->
  <path d="M 49 458 L 458 49" fill="none" stroke="#4e3412"
        stroke-width="6.2" stroke-linecap="round" opacity="0.38"/>
  <path d="M 49 458 L 458 49" fill="none" stroke="url(#gold)"
        stroke-width="4.2" stroke-linecap="round"/>
  <path d="M 53 454 L 454 53" fill="none" class="slash-highlight"
        stroke-width="0.7" stroke-linecap="round"/>

  <!-- Four-point star, kept broad enough to remain legible below 200 CSS pixels. -->
  <path d="M 256 106
           C 258 173 261 207 272 218
           C 283 227 322 229 378 230
           C 322 232 283 234 272 243
           C 262 254 259 287 256 354
           C 253 287 250 254 240 243
           C 229 234 190 232 134 230
           C 190 229 229 227 240 218
           C 251 207 254 173 256 106 Z"
        class="star"/>
  <path d="M 256 205
           C 259 218 263 226 276 230
           C 263 234 259 242 256 255
           C 253 242 249 234 236 230
           C 249 226 253 218 256 205 Z"
        class="star-core"/>

  <!-- Font-independent wordmark paths; the V remains the gold accent. -->
  <g transform="translate(-195 -286.5)">
    <path d="M 282.85 806.55 L 292.25 806.55 L 310.85 829.75
             L 329.55 806.55 L 338.65 806.55 L 314.65 835.35
             L 314.65 857.25 L 307.05 857.25 L 307.05 835.35 Z"
          class="word"/>

    <path d="M 376.85 806.75 L 386.15 806.75 L 403.95 847.85
             L 421.05 806.75 L 430.15 806.75 L 408.05 857.15
             L 399.55 857.15 Z"
          class="word-accent"/>

    <path d="M 475.25 806.65 L 519.55 806.65 L 519.55 813.55
             L 482.65 813.55 L 482.65 827.40 L 515.55 827.40
             L 515.55 833.55 L 482.65 833.55 L 482.65 849.65
             L 519.55 849.65 L 519.55 857.15 L 475.25 857.15 Z"
          class="word"/>

    <path d="M 567.45 806.70 L 578.10 806.70 L 593.70 827.05
             L 609.60 806.70 L 619.20 806.70 L 598.65 831.85
             L 619.25 857.20 L 608.85 857.20 L 593.55 836.75
             L 578.10 857.20 L 567.35 857.20 L 588.55 831.75 Z"
          class="word"/>
  </g>
</svg>
